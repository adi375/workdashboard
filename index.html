if(g('data-meet-del')){const id=g('data-meet-del').dataset.meetDel;if(confirm('Delete this meeting?')){S.meetings=(S.meetings||[]).filter(x=>x.id!==id);save();render()}return}
if(g('data-save-meet')){const n=$('#m-title').value.trim();if(!n){$('#m-title').focus();return}
Object.assign(draft,{title:n,date:$('#m-date').value,start:$('#m-start').value,end:$('#m-end').value,client:$('#m-client').value.trim(),link:$('#m-link').value.trim(),agenda:$('#m-agenda').value,notes:$('#m-notes').value,done:$('#m-done').checked});
if(draft.isNew){delete draft.isNew;S.meetings=S.meetings||[];S.meetings.push(draft)}else S.meetings=S.meetings.map(x=>x.id===draft.id?draft:x);
closeM();save();sdate=draft.date;render();toast('Meeting saved');return}
if(g('data-del-meet')){if(confirm('Delete this meeting?')){S.meetings=S.meetings.filter(x=>x.id!==draft.id);closeM();save();render()}return}
if(g('data-adv')){e.stopPropagation();const p=S.projects.find(x=>x.id===g('data-adv').dataset.adv);return move(p.id,STAGES[STAGES.indexOf(p.stage)+1])}
if(g('data-new'))return modal();
if(g('data-eod'))return eod(false);
if(g('data-sf')){sf=g('data-sf').dataset.sf;return render()}
if(g('data-day')){sdate=g('data-day').dataset.day;return render()}
if(g('data-today')){sdate=td();return render()}
if(g('data-copy')){const x=sumText(sdate||td());(navigator.clipboard?navigator.clipboard.writeText(x):Promise.reject()).then(()=>toast('Summary copied'),()=>{const a=document.createElement('textarea');a.value=x;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Summary copied')}catch(e){toast('Copy failed')}a.remove()});return}
if(g('data-notif')){if('Notification' in window)Notification.requestPermission().then(()=>render());return}
if(g('data-snooze')){closeM();toast('Reminder in 15 minutes');return}
if(g('data-skip')){S.set.done[td()]=1;closeM();save();render();toast('Skipped for today');return}
if(g('data-eodsave')){document.querySelectorAll('#modal .ei').forEach(el=>{const pr=S.projects.find(x=>x.id===el.dataset.eid);if(!pr)return;pr.status=el.querySelector('select').value;setUpd(pr,el.querySelector('textarea').value)});S.set.done[td()]=1;closeM();save();cur='summary';sdate=td();render();toast('Daily summary is ready');return}
if(g('data-nav')){cur=g('data-nav').dataset.nav;q='';if(cur==='meetings')sdate=td();return render()}
if(g('data-v')){view=g('data-v').dataset.v;return render()}
if(g('data-tgl')){const n=dk()?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('ga-theme',n)}catch(e){}applyPal();return render()}
if(g('data-pal')){pal=g('data-pal').dataset.pal;try{localStorage.setItem('ga-pal-wa',pal)}catch(e){}applyPal();return render()}
if(g('data-addt'))return addt();
if(g('data-rt')){draft.tasks.splice(+g('data-rt').dataset.rt,1);return tasks()}
if(g('data-close')||t.classList.contains('ov'))return closeM();
if(g('data-del')){if(confirm('Delete this work item?')){S.projects=S.projects.filter(x=>x.id!==draft.id);closeM();save();render()}return}
if(g('data-save')){const n=$('#f-name').value.trim();if(!n){$('#f-name').focus();return}
const st=$('#f-stage').value;if(!draft.isNew&&st!==draft.stage)draft.log.push({s:st,at:td()});let ss=$('#f-status').value;if(st==='Delivered'&&draft.stage!=='Delivered'&&ss==='In process')ss='Closed';
Object.assign(draft,{name:n,section:$('#f-sec').value,account:$('#f-acc').value.trim(),priority:$('#f-pri').value,due:$('#f-due').value,stage:st,status:ss,blocked:$('#f-blk').checked,amount:$('#f-amt').value,pay:$('#f-pay').value,notes:$('#f-notes').value});
if(draft.isNew){delete draft.isNew;S.projects.push(draft)}else S.projects=S.projects.map(x=>x.id===draft.id?draft:x);
setUpd(draft,$('#f-upd').value);closeM();save();render();toast('Saved');return}
const c=t.closest('[data-id]');if(c&&!t.closest('#modal'))modal(c.dataset.id)});
document.addEventListener('change',e=>{const t=e.target;
if(t.dataset.t!==undefined){draft.tasks[+t.dataset.t].d=t.checked;tasks()}
if(t.id==='sd'&&t.value){sdate=t.value;render()}
if(t.id==='mdate'&&t.value){sdate=t.value;render()}
if(t.id==='set-time'&&t.value){S.set.time=t.value;save();render();toast('Reminder time set to '+t.value)}if(t.id==='f-stage')tasks();if(t.id==='f-sec')$('#payf').style.display=t.value==='payment'?'grid':'none'});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.target.id==='nt'&&e.key==='Enter'){e.preventDefault();addt()}if(e.key==='Escape')closeM();if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.sc,.li,.card,tr.r,.ur.miss')){e.preventDefault();e.target.click()}});
let dragId=null;const cs=e=>e.target.closest&&e.target.closest('.col[data-stage]');
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.card');if(c){dragId=c.dataset.id;e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const c=cs(e);if(c&&dragId){e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'));c.classList.add('over')}});
document.addEventListener('drop',e=>{const c=cs(e);if(c&&dragId){e.preventDefault();move(dragId,c.dataset.stage)}dragId=null});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'))});

const cls=x=>x==='On hold'?'hold':x==='Closed'?'closed':'';
const sch=p=>sts(p)==='In process'?'':`<span class="chip ${cls(sts(p))}">${sts(p)}</span>`;
const updFor=(pid,d)=>S.upd.find(u=>u.pid===pid&&u.d===d);
function setUpd(p,t){t=(t||'').trim();const i=S.upd.findIndex(u=>u.pid===p.id&&u.d===td());
if(!t){if(i>=0)S.upd.splice(i,1);return}
const u={pid:p.id,d:td(),t,name:p.name,sec:p.section,acc:p.account,stage:p.stage,status:sts(p)};if(i>=0)S.upd[i]=u;else S.upd.push(u)}
const longDate=d=>new Date(d+'T00:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const shift=(d,n)=>{const x=new Date(d+'T00:00');x.setDate(x.getDate()+n);return new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const dueNow=()=>nowHM()>=S.set.time&&!S.set.done[td()]&&S.projects.some(act);
function eod(auto){const items=S.projects.filter(act);
if(!items.length){S.set.done[td()]=1;save();render();toast('No open work to update');return}
const o=v=>STS.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
$('#modal').innerHTML=`<div class="ov"><div class="panel" role="dialog" aria-modal="true" aria-label="End of day update"><div class="pbody"><h2>${auto?'Time for your daily update':'Daily update'}</h2><p class="sub2">${longDate(td())} · ${items.length} open work item${items.length>1?'s':''}. Note what moved today on each one.</p>
${Object.entries(SEC).map(([k,s])=>{const l=items.filter(p=>p.section===k);return l.length?`<section class="eg" style="--sc:${s.c}"><h3><i></i>${s.n}<span>${l.length}</span></h3>${l.map(p=>`<div class="ei" data-eid="${p.id}"><div class="eh"><b>${esc(p.name)}</b><select aria-label="Status">${o(sts(p))}</select></div><div class="sub">${esc(p.account)||s.n} · ${p.stage}</div><textarea rows="2" placeholder="Update for today…">${esc((updFor(p.id,td())||{}).t||'')}</textarea></div>`).join('')}</section>`:''}).join('')}
</div><div class="acts"><button class="p" data-eodsave>Save updates</button><button data-snooze>Remind me in 15 min</button><span class="sp"></span><button data-skip>Skip today</button></div></div></div>`;
requestAnimationFrame(()=>$('#modal .ov').classList.add('in'));const f=$('#modal textarea');if(f)f.focus()}
function dayData(d){const U=S.upd.filter(u=>u.d===d);return{U,open:d===td()?S.projects.filter(act).filter(p=>!U.some(u=>u.pid===p.id)):[]}}
function sumText(d){const{U,open}=dayData(d);let t='GrowthAccel – Daily summary\n'+longDate(d)+'\n';
Object.entries(SEC).forEach(([k,s])=>{const a=U.filter(u=>u.sec===k);if(!a.length)return;t+='\n'+s.n+'\n'+a.map(u=>'• '+u.name+(u.acc?' ('+u.acc+')':'')+' ['+u.status+' · '+u.stage+']\n  '+u.t.replace(/\n/g,'\n  ')).join('\n')+'\n'});
if(open.length)t+='\nNo update yet: '+open.map(p=>p.name).join(', ')+'\n';if(!U.length&&!open.length)t+='\nNo updates recorded.\n';return t}
function summary(){const d=sdate||td(),{U,open}=dayData(d),isT=d===td(),perm='Notification' in window?Notification.permission:'unsupported';
const dates=[...new Set(S.upd.map(u=>u.d))].sort().reverse().slice(0,8);
const grp=Object.entries(SEC).map(([k,s])=>{const a=U.filter(u=>u.sec===k),m=open.filter(p=>p.section===k);if(!a.length&&!m.length)return'';
return `<section class="grp" style="--sc:${s.c}"><h3><i></i>${s.n}<span>${a.length} update${a.length===1?'':'s'}</span></h3>${a.map(u=>`<div class="ur"><div class="uh"><b>${esc(u.name)}</b><span class="chip ${cls(u.status)}">${u.status}</span><span class="chip">${u.stage}</span></div><div class="sub">${esc(u.acc)||s.n}</div><p>${esc(u.t)}</p></div>`).join('')}${m.map(p=>`<div class="ur miss" tabindex="0" role="button" data-id="${p.id}"><div class="uh"><b>${esc(p.name)}</b><span class="chip soon">No update yet</span></div></div>`).join('')}</section>`}).join('');
return `<div class="top"><div><h1>Daily summary</h1><p>${longDate(d)}${isT?' · today':''}</p></div><div class="dn"><button data-day="${shift(d,-1)}" aria-label="Previous day">${ico('chl')}</button><input type="date" id="sd" value="${d}" aria-label="Pick a date"><button data-day="${shift(d,1)}" aria-label="Next day">${ico('chr')}</button>${isT?'':'<button data-today>Today</button>'}${isT?'<button data-eod>Add updates</button>':''}<button class="p" data-copy>Copy summary</button></div></div>
<div class="kp"><div class="k"><b>${U.length}</b><span>Updates given</span></div><div class="k ${open.length?'a':''}"><b>${isT?open.length:'–'}</b><span>Still pending</span></div><div class="k"><b>${new Set(U.map(u=>u.sec)).size}</b><span>Projects covered</span></div></div>
${dates.length?`<div class="days">${dates.map(x=>`<button data-day="${x}" class="${x===d?'on':''}">${x.slice(5)} · ${S.upd.filter(u=>u.d===x).length}</button>`).join('')}</div>`:''}
${grp||`<div class="empty"><h3 style="color:var(--ink);margin:0 0 6px">No updates for this day</h3>${isT?'Updates you write at the daily popup (or in a work item) appear here automatically.':'Nothing was recorded on this date.'}</div>`}
<div class="pn" style="margin-top:18px;padding:16px 18px"><h4 style="margin-left:0">Daily reminder</h4><div class="dn"><label style="margin:0">Remind me at<input type="time" id="set-time" value="${S.set.time}" style="width:auto;margin-left:8px;display:inline-block"></label>${perm==='granted'?'<span class="chip closed">Browser notifications on</span>':perm==='denied'?'<span class="chip hold">Notifications blocked in browser settings</span>':perm==='default'?'<button data-notif>Enable browser notifications</button>':''}</div><p class="none" style="padding:10px 0 0">The popup and notification appear only while this tracker is open in a browser tab.</p></div>`}
let wasDue=null;
function tick(){const due=dueNow();if(due!==wasDue){wasDue=due;render()}
if(due&&!$('#modal').innerHTML&&Date.now()>=snoozeUntil){if(S.set.notified!==td()){S.set.notified=td();save();try{if(Notification.permission==='granted')new Notification('GrowthAccel: time for your daily update',{body:S.projects.filter(act).length+' open work items need an update.'})}catch(e){}}eod(true)}}
applyPal();render();setInterval(tick,15000);tick();
</script>
</body>
</html>
