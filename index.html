<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Work Tracker</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --text:#1c2230; --muted:#6b7385; --line:#e3e6ec;
  --accent:#4f6df5; --accent-soft:#e9edff; --good:#22a06b; --warn:#e8a317; --bad:#d9455f;
}
:root[data-theme="dark"]{
  --bg:#12151c; --card:#1b1f2a; --text:#e8ebf2; --muted:#98a0b3; --line:#2a3040;
  --accent:#7b92ff; --accent-soft:#252c47; --good:#3bc48b; --warn:#f0b83a; --bad:#f0627a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:18px;margin:0}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--muted);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit;font-weight:600}
nav button.active{background:var(--accent-soft);color:var(--accent)}
.tools{display:flex;gap:6px;align-items:center}
main{max-width:1100px;margin:0 auto;padding:20px}
.view{display:none}.view.active{display:block}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:14px}
.charts{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat .n{font-size:30px;font-weight:700}
.stat .l{color:var(--muted);font-size:13px}
button,input,select,textarea{font:inherit;color:var(--text)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;resize:vertical}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.grow>*:first-child{flex:1;min-width:180px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.item{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.item .title{flex:1;min-width:0;overflow-wrap:anywhere}
.item.done .title{text-decoration:line-through;color:var(--muted)}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.high{background:#fde3e8;color:var(--bad)}.tag.med{background:#fdf0d2;color:#a97300}.tag.low{background:#dff5ea;color:var(--good)}
.tag.over{background:var(--bad);color:#fff}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.muted{color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:24px}
.logday{margin-top:16px}.logday h4{margin:0 0 6px;font-size:14px}
svg text{fill:var(--muted);font-size:10px}
.del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1}
.del:hover{color:var(--bad)}
@media(max-width:600px){main{padding:12px}}
</style>
</head>
<body>
<header>
  <h1>📋 My Work Tracker</h1>
  <nav id="nav">
    <button data-v="dash" class="active">Dashboard</button>
    <button data-v="tasks">Tasks</button>
    <button data-v="projects">Projects</button>
    <button data-v="log">Daily Log</button>
  </nav>
  <div class="tools">
    <button class="btn ghost sm" id="export">Export</button>
    <button class="btn ghost sm" id="import">Import</button>
    <button class="btn ghost sm" id="theme">🌓</button>
    <input type="file" id="file" accept="application/json" hidden>
  </div>
</header>

<main>
  <section id="dash" class="view active">
    <div class="grid stats" id="stats"></div>
    <div class="grid charts">
      <div class="card"><h3>Tasks completed · last 14 days</h3><div id="c-done"></div></div>
      <div class="card"><h3>Hours logged · last 14 days</h3><div id="c-hours"></div></div>
      <div class="card"><h3>Tasks by status</h3><div id="c-status"></div></div>
      <div class="card"><h3>Project progress</h3><div id="c-proj"></div></div>
    </div>
  </section>

  <section id="tasks" class="view">
    <div class="card">
      <form id="task-form" class="row grow">
        <input id="t-title" placeholder="What needs doing?" required>
        <select id="t-proj"></select>
        <select id="t-pri"><option value="med">Medium</option><option value="high">High</option><option value="low">Low</option></select>
        <input id="t-due" type="date">
        <button class="btn">Add task</button>
      </form>
      <div class="row" style="margin-top:12px">
        <select id="f-status"><option value="active">Open</option><option value="all">All</option><option value="todo">To do</option><option value="doing">Doing</option><option value="done">Done</option></select>
        <select id="f-proj"></select>
      </div>
    </div>
    <div class="list" id="task-list"></div>
  </section>

  <section id="projects" class="view">
    <div class="card">
      <form id="proj-form" class="row grow">
        <input id="p-name" placeholder="Project or goal name" required>
        <input id="p-goal" placeholder="Goal / notes (optional)">
        <input id="p-color" type="color" value="#4f6df5">
        <button class="btn">Add project</button>
      </form>
    </div>
    <div class="list" id="proj-list"></div>
  </section>

  <section id="log" class="view">
    <div class="card">
      <form id="log-form">
        <div class="row" style="margin-bottom:8px">
          <input id="l-date" type="date" required>
          <input id="l-hours" type="number" min="0" step="0.25" placeholder="Hours" style="width:110px">
          <select id="l-proj"></select>
        </div>
        <textarea id="l-text" rows="3" placeholder="What did you work on today?" required></textarea>
        <div style="margin-top:8px"><button class="btn">Add entry</button></div>
      </form>
    </div>
    <div id="log-list"></div>
  </section>
</main>

<script>
(function(){
const KEY='work-tracker-v1';
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const daysBack=n=>{const a=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push(iso(d))}return a};

let db;
function load(){
  try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!db||typeof db!=='object') db={projects:[],tasks:[],logs:[]};
  db.projects=db.projects||[];db.tasks=db.tasks||[];db.logs=db.logs||[];
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Could not save to browser storage.')}render()}
const proj=id=>db.projects.find(p=>p.id===id);

// theme
const root=document.documentElement;
try{root.dataset.theme=localStorage.getItem('wt-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}
$('#theme').onclick=()=>{const t=root.dataset.theme==='dark'?'light':'dark';root.dataset.theme=t;try{localStorage.setItem('wt-theme',t)}catch(e){}};

// nav
$('#nav').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===b.dataset.v));
};

// export / import
$('#export').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));
  a.download='work-tracker-'+today()+'.json';a.click();
};
$('#import').onclick=()=>$('#file').click();
$('#file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tasks))throw 0;
    if(confirm('Replace current data with the imported file?')){db=d;save()}}catch(x){alert('Not a valid tracker backup file.')}};
  r.readAsText(f);e.target.value='';
};

// forms
$('#task-form').onsubmit=e=>{e.preventDefault();
  db.tasks.unshift({id:uid(),title:$('#t-title').value.trim(),projectId:$('#t-proj').value,priority:$('#t-pri').value,due:$('#t-due').value,status:'todo',created:today(),done:''});
  e.target.reset();save()};
$('#proj-form').onsubmit=e=>{e.preventDefault();
  db.projects.push({id:uid(),name:$('#p-name').value.trim(),goal:$('#p-goal').value.trim(),color:$('#p-color').value});
  e.target.reset();$('#p-color').value='#4f6df5';save()};
$('#log-form').onsubmit=e=>{e.preventDefault();
  db.logs.unshift({id:uid(),date:$('#l-date').value,text:$('#l-text').value.trim(),hours:parseFloat($('#l-hours').value)||0,projectId:$('#l-proj').value});
  $('#l-text').value='';$('#l-hours').value='';save()};
$('#f-status').onchange=renderTasks;$('#f-proj').onchange=renderTasks;

// list actions
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const id=t.dataset.id,act=t.dataset.act;
  if(act==='del-task'){if(confirm('Delete this task?')){db.tasks=db.tasks.filter(x=>x.id!==id);save()}}
  if(act==='del-proj'){if(confirm('Delete this project? Its tasks will be kept without a project.')){db.projects=db.projects.filter(x=>x.id!==id);db.tasks.forEach(x=>{if(x.projectId===id)x.projectId=''});db.logs.forEach(x=>{if(x.projectId===id)x.projectId=''});save()}}
  if(act==='del-log'){db.logs=db.logs.filter(x=>x.id!==id);save()}
  if(act==='toggle'){const x=db.tasks.find(k=>k.id===id);x.status=x.status==='done'?'todo':'done';x.done=x.status==='done'?today():'';save()}
});
document.addEventListener('change',e=>{
  const t=e.target.closest('[data-status]');if(!t)return;
  const x=db.tasks.find(k=>k.id===t.dataset.status);x.status=t.value;x.done=t.value==='done'?(x.done||today()):'';save();
});

// render helpers
function projOptions(sel,first){
  return `<option value="">${first}</option>`+db.projects.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)}</option>`).join('');
}
function renderSelects(){
  const keep={t:$('#t-proj').value,f:$('#f-proj').value,l:$('#l-proj').value};
  $('#t-proj').innerHTML=projOptions(keep.t,'No project');
  $('#f-proj').innerHTML=projOptions(keep.f,'All projects');
  $('#l-proj').innerHTML=projOptions(keep.l,'No project');
}
function renderTasks(){
  const fs=$('#f-status').value,fp=$('#f-proj').value;
  let list=db.tasks.filter(t=>(fs==='all'||(fs==='active'?t.status!=='done':t.status===fs))&&(!fp||t.projectId===fp));
  const po={high:0,med:1,low:2};
  list.sort((a,b)=>(a.status==='done')-(b.status==='done')||po[a.priority]-po[b.priority]||(a.due||'9').localeCompare(b.due||'9'));
  $('#task-list').innerHTML=list.length?list.map(t=>{
    const p=proj(t.projectId),over=t.due&&t.status!=='done'&&t.due<today();
    return `<div class="item ${t.status==='done'?'done':''}">
      <input type="checkbox" data-act="toggle" data-id="${t.id}" ${t.status==='done'?'checked':''}>
      <div class="title">${esc(t.title)}</div>
      ${p?`<span class="tag" style="background:${esc(p.color)}22;color:${esc(p.color)}">${esc(p.name)}</span>`:''}
      <span class="tag ${t.priority}">${t.priority}</span>
      ${t.due?`<span class="tag ${over?'over':''}">${over?'Overdue · ':''}${esc(t.due)}</span>`:''}
      <select data-status="${t.id}">${['todo','doing','done'].map(s=>`<option ${s===t.status?'selected':''} value="${s}">${s}</option>`).join('')}</select>
      <button class="del" data-act="del-task" data-id="${t.id}" title="Delete">×</button></div>`}).join(''):'<div class="empty">No tasks here. Add one above.</div>';
}
function projStats(id){const ts=db.tasks.filter(t=>t.projectId===id);const d=ts.filter(t=>t.status==='done').length;return{total:ts.length,done:d,pct:ts.length?Math.round(d/ts.length*100):0}}
function renderProjects(){
  $('#proj-list').innerHTML=db.projects.length?db.projects.map(p=>{const s=projStats(p.id);
    return `<div class="item" style="align-items:flex-start"><span class="dot" style="background:${esc(p.color)};margin-top:7px"></span>
      <div class="title"><strong>${esc(p.name)}</strong>${p.goal?`<div class="muted">${esc(p.goal)}</div>`:''}
      <div class="bar"><i style="width:${s.pct}%;background:${esc(p.color)}"></i></div>
      <div class="muted" style="font-size:13px">${s.done}/${s.total} tasks done · ${s.pct}%</div></div>
      <button class="del" data-act="del-proj" data-id="${p.id}" title="Delete">×</button></div>`}).join(''):'<div class="empty">No projects yet. Create one to group your tasks.</div>';
}
function renderLog(){
  const by={};db.logs.forEach(l=>(by[l.date]=by[l.date]||[]).push(l));
  const dates=Object.keys(by).sort().reverse();
  $('#log-list').innerHTML=dates.length?dates.map(d=>{
    const tot=by[d].reduce((a,l)=>a+l.hours,0);
    return `<div class="logday"><h4>${esc(d)} <span class="muted">${tot?'· '+tot+'h':''}</span></h4><div class="list" style="margin-top:6px">`+
    by[d].map(l=>{const p=proj(l.projectId);return `<div class="item"><div class="title" style="white-space:pre-wrap">${esc(l.text)}</div>
      ${p?`<span class="tag" style="background:${esc(p.color)}22;color:${esc(p.color)}">${esc(p.name)}</span>`:''}
      ${l.hours?`<span class="tag">${l.hours}h</span>`:''}
      <button class="del" data-act="del-log" data-id="${l.id}" title="Delete">×</button></div>`}).join('')+`</div></div>`}).join(''):'<div class="empty">No log entries yet.</div>';
}

// charts (plain SVG)
function barChart(el,labels,vals,color){
  const W=420,H=170,pad=22,max=Math.max(1,...vals),bw=(W-pad)/vals.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  for(let g=0;g<=2;g++){const y=H-pad-(H-pad-8)*g/2;s+=`<line x1="${pad}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="0" y="${y+3}">${+(max*g/2).toFixed(1)}</text>`}
  vals.forEach((v,i)=>{const h=(H-pad-8)*v/max,x=pad+i*bw+3;
    s+=`<rect x="${x}" y="${H-pad-h}" width="${bw-6}" height="${h}" rx="3" fill="${color}"><title>${labels[i]}: ${v}</title></rect>`;
    if(i%2===0||vals.length<8)s+=`<text x="${x+(bw-6)/2}" y="${H-6}" text-anchor="middle">${labels[i].slice(5)}</text>`});
  el.innerHTML=s+'</svg>';
}
function donut(el,parts){
  const total=parts.reduce((a,p)=>a+p.v,0);
  if(!total){el.innerHTML='<div class="empty">No tasks yet.</div>';return}
  const R=60,C=2*Math.PI*R;let off=0,s=`<svg viewBox="0 0 320 150" width="100%"><g transform="translate(75,75) rotate(-90)">`;
  parts.forEach(p=>{const len=C*p.v/total;s+=`<circle r="${R}" fill="none" stroke="${p.c}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"/>`;off+=len});
  s+=`</g><text x="75" y="80" text-anchor="middle" style="font-size:20px;font-weight:700;fill:var(--text)">${total}</text>`;
  parts.forEach((p,i)=>{s+=`<rect x="170" y="${35+i*28}" width="12" height="12" rx="3" fill="${p.c}"/><text x="190" y="${45+i*28}" style="font-size:13px;fill:var(--text)">${p.n}: ${p.v}</text>`});
  el.innerHTML=s+'</svg>';
}
function renderDash(){
  const t=db.tasks,td=today(),wk=daysBack(7);
  const open=t.filter(x=>x.status!=='done').length;
  const doneWk=t.filter(x=>x.done&&wk.includes(x.done)).length;
  const over=t.filter(x=>x.due&&x.status!=='done'&&x.due<td).length;
  const hrsWk=db.logs.filter(l=>wk.includes(l.date)).reduce((a,l)=>a+l.hours,0);
  const st=(n,l,c)=>`<div class="card stat"><div class="n" style="color:${c||'inherit'}">${n}</div><div class="l">${l}</div></div>`;
  $('#stats').innerHTML=st(open,'Open tasks')+st(doneWk,'Done in last 7 days','var(--good)')+st(over,'Overdue',over?'var(--bad)':'')+st(+hrsWk.toFixed(2),'Hours logged (7 days)');
  const d14=daysBack(14);
  barChart($('#c-done'),d14,d14.map(d=>t.filter(x=>x.done===d).length),'var(--good)');
  barChart($('#c-hours'),d14,d14.map(d=>+db.logs.filter(l=>l.date===d).reduce((a,l)=>a+l.hours,0).toFixed(2)),'var(--accent)');
  donut($('#c-status'),[{n:'To do',v:t.filter(x=>x.status==='todo').length,c:'#9aa3b8'},{n:'Doing',v:t.filter(x=>x.status==='doing').length,c:'#e8a317'},{n:'Done',v:t.filter(x=>x.status==='done').length,c:'#22a06b'}]);
  $('#c-proj').innerHTML=db.projects.length?db.projects.map(p=>{const s=projStats(p.id);
    return `<div style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><span><span class="dot" style="display:inline-block;background:${esc(p.color)}"></span> ${esc(p.name)}</span><span class="muted">${s.done}/${s.total} · ${s.pct}%</span></div><div class="bar"><i style="width:${s.pct}%;background:${esc(p.color)}"></i></div></div>`}).join(''):'<div class="empty">Add a project to see progress.</div>';
}

function render(){renderSelects();renderTasks();renderProjects();renderLog();renderDash()}
$('#l-date').value=today();
load();render();
})();
</script>
</body>
</html>
